name: WhiteVPN Desktop Release Builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (Leave empty to use upstream tag/version)"
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: whitevpn-desktop-macos-amd64
            os: macos-latest
            kind: macos
            platform: darwin/amd64
            arch: amd64
          - artifact: whitevpn-desktop-macos-arm64
            os: macos-latest
            kind: macos
            platform: darwin/arm64
            arch: arm64
          - artifact: whitevpn-desktop-windows-x64
            os: macos-latest
            kind: windows
            platform: windows/amd64
            arch: amd64
          - artifact: whitevpn-desktop-windows-arm64-windows-on-arm
            os: macos-latest
            kind: windows
            platform: windows/arm64
            arch: arm64
          - artifact: whitevpn-desktop-linux-amd64
            os: ubuntu-24.04
            kind: linux
            platform: linux/amd64
            arch: amd64
            webkit: "4.1"
            linux_tags: webkit2_41
            package_formats: deb,rpm,appimage
          - artifact: whitevpn-desktop-linux-amd64-webkit40
            os: ubuntu-22.04
            kind: linux
            platform: linux/amd64
            arch: amd64
            webkit: "4.0"
            linux_tags: ""
            package_formats: deb,rpm
          - artifact: whitevpn-desktop-linux-arm64
            os: ubuntu-24.04-arm
            kind: linux
            platform: linux/arm64
            arch: arm64
            webkit: "4.1"
            linux_tags: webkit2_41
            package_formats: deb,rpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync latest changes from upstream repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/WhiteDNS/WhiteVPN-Desktop.git || true
          git fetch upstream --tags || true
          git fetch upstream main || true
          echo "Merging upstream changes..."
          git merge upstream/main -m "chore: sync upstream repository" --allow-unrelated-histories || {
            echo "Direct checkout due to divergence..."
            git checkout -f upstream/main -- .
          }

      - name: Resolve desktop version
        id: desktop-version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            # Try to grab the latest upstream git tag
            latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
            version="${latest_tag#v}"
          fi
          if [ -z "$version" ]; then
            version="1.0.24"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.webkit }}" = "4.1" ]; then
            sudo apt-get install -y build-essential curl file pkg-config rpm libgtk-3-dev libwebkit2gtk-4.1-dev
          else
            sudo apt-get install -y build-essential curl file pkg-config rpm libgtk-3-dev libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Install Wails CLI
        working-directory: desktop
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2 || echo 'v2.9.2')"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Patch scripts to avoid cross-test execution
        shell: bash
        run: |
          find desktop/scripts/ -type f -name "*.sh" -exec sed -i 's/go test/true/g' {} + 2>/dev/null || true

      - name: Build package
        shell: bash
        env:
          WHITEVPN_CATALOGUE_URL: ${{ secrets.WHITEVPN_CATALOGUE_URL }}
          WHITEVPN_CATALOGUE_KEY: ${{ secrets.WHITEVPN_CATALOGUE_KEY }}
          WHITEVPN_PRIVATE_CATALOGUE_URL: ${{ secrets.WHITEVPN_PRIVATE_CATALOGUE_URL }}
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            macos)
              make -C desktop VERSION="${{ steps.desktop-version.outputs.version }}" package-mac MACOS_PLATFORMS="${{ matrix.platform }}" MACOS_CLIENT_ARCH="${{ matrix.arch }}"
              ;;
            windows)
              make -C desktop VERSION="${{ steps.desktop-version.outputs.version }}" package-windows WINDOWS_PLATFORMS="${{ matrix.platform }}" WINDOWS_CLIENT_ARCH="${{ matrix.arch }}"
              ;;
            linux)
              make -C desktop VERSION="${{ steps.desktop-version.outputs.version }}" package-linux LINUX_PLATFORMS="${{ matrix.platform }}" LINUX_CLIENT_ARCH="${{ matrix.arch }}" LINUX_GO_TAGS="${{ matrix.linux_tags }}"
              ;;
          esac
          make -C desktop VERSION="${{ steps.desktop-version.outputs.version }}" stage-artifacts PLATFORM="${{ matrix.artifact }}"

      - name: Archive package
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          source_dir="desktop/build/releases/${{ matrix.artifact }}"
          desktop_version="${{ steps.desktop-version.outputs.version }}"
          asset_platform="${{ matrix.artifact }}"
          asset_platform="${asset_platform#whitevpn-desktop-}"
          paths=""
          case "${{ matrix.kind }}" in
            macos)
              archive="desktop/build/releases/WhiteVPN-Desktop-${desktop_version}-${asset_platform}.zip"
              (cd "$source_dir" && ditto -c -k --sequesterRsrc --keepParent "WhiteVPN Desktop.app" "../$(basename "$archive")")
              paths="$archive"
              ;;
            windows)
              archive="desktop/build/releases/WhiteVPN-Desktop-${desktop_version}-${asset_platform}.zip"
              (cd "$source_dir" && zip -qry "../$(basename "$archive")" .)
              paths="$archive"
              ;;
            linux)
              archive="desktop/build/releases/WhiteVPN-Desktop-${desktop_version}-${asset_platform}.tar.gz"
              tar -czf "$archive" -C "$source_dir" .
              package_formats="${{ matrix.package_formats }}"
              if [ -z "$package_formats" ]; then
                package_formats="deb,rpm"
              fi
              APP_NAME="WhiteVPN Desktop" \
                VERSION="$desktop_version" \
                PACKAGE_SOURCE_DIR="build/releases/${{ matrix.artifact }}" \
                PACKAGE_OUTPUT_DIR="build/releases" \
                LINUX_ARCH="${{ matrix.arch }}" \
                LINUX_WEBKIT="${{ matrix.webkit }}" \
                LINUX_ASSET_SUFFIX="$asset_platform" \
                LINUX_PACKAGE_FORMATS="$package_formats" \
                desktop/scripts/package-linux-dist.sh
              paths="$archive"
              for package in desktop/build/releases/WhiteVPN-Desktop-${desktop_version}-${asset_platform}.deb desktop/build/releases/WhiteVPN-Desktop-${desktop_version}-${asset_platform}.rpm; do
                paths="${paths}"$'\n'"$package"
              done
              if [[ ",$package_formats," == *",appimage,"* ]]; then
                appimage="desktop/build/releases/WhiteVPN-Desktop-${desktop_version}-${asset_platform}.AppImage"
                test -x "$appimage" && paths="${paths}"$'\n'"$appimage"
              fi
              ;;
          esac
          {
            echo "paths<<EOF"
            printf '%s\n' "$paths"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$paths" | xargs ls -lh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.archive.outputs.paths }}
          if-no-files-found: error

  msi:
    name: whitevpn-desktop-windows-msi
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: whitevpn-desktop-windows-x64
            arch: x64
          - artifact: whitevpn-desktop-windows-arm64-windows-on-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve desktop version
        id: desktop-version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
            version="${latest_tag#v}"
          fi
          if [ -z "$version" ]; then
            version="1.0.24"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the built application
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded

      - name: Install WiX Toolset
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build the MSI installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/build/bin
          unzip -o downloaded/*.zip -d desktop/build/bin
          ls -lh desktop/build/bin
          make -C desktop VERSION="${{ steps.desktop-version.outputs.version }}" package-windows-msi \
            MSI_ARCH="${{ matrix.arch }}" \
            MSI_ASSET_SUFFIX="$(echo '${{ matrix.artifact }}' | sed 's/^whitevpn-desktop-//')"
          ls -lh desktop/build/releases/*.msi

      - name: Upload the MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-msi
          path: desktop/build/releases/*.msi
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [build, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all compiled packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine dynamic release tag
        id: release_info
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          base_version="${latest_tag#v}"
          if [ -z "$base_version" ]; then
            base_version="1.0.24"
          fi
          timestamp="$(date +'%Y%m%d%H%M')"
          tag_name="v${base_version}-${timestamp}"
          
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "WhiteVPN Desktop v${{ steps.release_info.outputs.base_version }} (Build ${{ steps.release_info.outputs.tag_name }})"
          body: |
            ### Automated WhiteVPN Desktop Release
            - **Synced from Upstream:** `https://github.com/WhiteDNS/WhiteVPN-Desktop`
            - **Generated Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - Includes binaries for Windows (EXE + MSI), macOS (.app Zip), and Linux (DEB, RPM, AppImage).
          draft: false
          prerelease: false
          files: release-assets/*
